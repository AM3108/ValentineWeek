<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Happy Rose Day!</title>
    <!-- <link rel="stylesheet" href="quotes.css"> -->
    <link rel="stylesheet" href="days.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        .rose-game-wrap {
            position: relative;
            z-index: 2;
            margin: 0.75rem 0;
            padding: 1rem;
            background: #ffffff !important;
            border: 3px solid #e91e8c;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .rose-game-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #c2185b !important;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .rose-game-hint {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            color: #444 !important;
            text-align: center;
            margin-bottom: 0.75rem;
        }
        .rose-game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 220px;
            margin: 0 auto;
        }
        .rose-game-cell {
            aspect-ratio: 1;
            background: #ffffff !important;
            border: 3px solid #bdbdbd;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s, border-color 0.2s;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .rose-game-cell::before {
            content: '?';
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #9e9e9e !important;
        }
        .rose-game-cell:hover:not(.revealed) {
            background: #ffebee !important;
            border-color: #e91e8c;
            transform: scale(1.06);
            box-shadow: 0 4px 16px rgba(233, 30, 140, 0.35);
        }
        .rose-game-cell:active:not(.revealed) {
            transform: scale(0.96);
        }
        .rose-game-cell.revealed {
            cursor: default;
            font-size: 2.2rem;
        }
        .rose-game-cell.revealed::before {
            content: none;
        }
        .rose-game-cell.revealed.pop {
            animation: rosePop 0.4s ease-out;
        }
        @keyframes rosePop {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        .rose-game-cell.rose {
            background: linear-gradient(145deg, #ffcdd2, #e91e8c) !important;
            border-color: #c2185b;
            box-shadow: 0 4px 20px rgba(233, 30, 140, 0.5);
        }
        .rose-game-cell.empty {
            background: #e0e0e0 !important;
            border-color: #9e9e9e;
            color: #616161 !important;
        }
        .rose-game-status {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #c2185b !important;
            text-align: center;
            margin-top: 0.75rem;
            min-height: 1.5em;
        }
        /* Hide quotes and express section until user finds all 3 roses */
        .quotes.rose-hidden-until-game {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="main">
        <h2>* Rose Day Special *</h2>
        <div class="hero">
            <div class="left">
                <div class="lovers-details">
                    <!-- <h3 id="user-profile-text">Love is in the air!</h3> -->
                    <img src="./assets/Love In The Air SVG Cut File.svg" alt="Love In The Air"
                        style="width:100px;height:100px;margin-top: 2.5rem;margin-bottom: 2.5rem;">
                    <lord-icon src="https://cdn.lordicon.com/lhwyshcs.json" trigger="hover"
                        style="width:100px;height:100px;backdrop-filter: blur(5px);">
                    </lord-icon>
                    <p id="fpname">Male</p>
                    <h3>💞</h3>
                    <lord-icon src="https://cdn.lordicon.com/btlpicdx.json" trigger="hover"
                        style="width:100px;height:100px;backdrop-filter: blur(5px);">
                    </lord-icon>
                    <p id="spname">Female</p>
                </div>
                <img src="./assets/All You Need Is Love SVG Cut File.svg" alt="All You Need Is Love"
                    style="width:100px;height:100px;margin-top: 2.5rem;">
            </div>
            <div class="right rose-right">
                <div class="back-container">
                    <a href="#" onclick="if (window.parent !== window) window.parent.postMessage('restoreDefaultMusic', '*'); window.history.back(); return false;">
                        <div class="back">
                            <span class="material-symbols-outlined">arrow_back</span>
                            <span class="back-text">Go back</span>
                        </div>
                    </a>
                </div>
                <h3 class="quote-heading">Special Note for my special one on the Rose Day! ❤️</h3>
                <div class="rose-game-wrap">
                    <p class="rose-game-title">Find 3 roses! 💐</p>
                    <p class="rose-game-hint">Click a box to reveal — find all 3 roses!</p>
                    <div class="rose-game-grid" id="rose-game-grid"></div>
                    <p class="rose-game-status" id="rose-game-status"></p>
                </div>
                <div class="quotes quotes-fullscreen rose-hidden-until-game" id="rose-quotes-area"></div>
            </div>
        </div>
        <div class="copyright-container">
            <h3 class="copyright">Created with ❤️ by <a id="instagramProfileLink" href="#" target="_blank"><span id="instagramProfileName"></span></a></h3>
        </div>
    </div>

    <script src="./express-feelings.js"></script>
    <script src="./quotesRoseDay.js"></script>
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
    <script>
        (function () {
            var grid = document.getElementById('rose-game-grid');
            var statusEl = document.getElementById('rose-game-status');
            if (!grid || !statusEl) return;
            var size = 9;
            var roseCount = 3;
            var cells = [];
            var roseIndices = [];
            var found = 0;

            function shuffle(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
                }
            }

            function initGame() {
                grid.innerHTML = '';
                cells = [];
                found = 0;
                statusEl.textContent = 'Click a cell to reveal!';
                var indices = [0, 1, 2, 3, 4, 5, 6, 7, 8];
                shuffle(indices);
                roseIndices = indices.slice(0, roseCount);
                for (var i = 0; i < size; i++) {
                    var cell = document.createElement('div');
                    cell.className = 'rose-game-cell';
                    cell.dataset.index = i;
                    cell.dataset.hasRose = roseIndices.indexOf(i) !== -1 ? '1' : '0';
                    cell.addEventListener('click', handleClick);
                    grid.appendChild(cell);
                    cells.push(cell);
                }
            }

            function handleClick(e) {
                var cell = e.currentTarget;
                if (cell.classList.contains('revealed')) return;
                cell.classList.add('revealed', 'pop');
                var hasRose = cell.dataset.hasRose === '1';
                if (hasRose) {
                    cell.classList.add('rose');
                    cell.textContent = '🌹';
                    found++;
                    if (found === roseCount) {
                        statusEl.textContent = 'You found all 3 roses! 💐';
                        statusEl.style.fontSize = '1.1rem';
                        setTimeout(function () {
                            statusEl.textContent = 'Congratulations Madam Ji, you are so smart! 🎉';
                            setTimeout(function () {
                                statusEl.textContent = '3...';
                                setTimeout(function () {
                                    statusEl.textContent = '2...';
                                    setTimeout(function () {
                                        statusEl.textContent = '1...';
                                        setTimeout(function () {
                                            var gameWrap = document.querySelector('.rose-game-wrap');
                                            var quotesArea = document.getElementById('rose-quotes-area');
                                            if (gameWrap) gameWrap.style.display = 'none';
                                            if (quotesArea) quotesArea.classList.remove('rose-hidden-until-game');
                                            if (typeof window.startRoseQuoteTypewriter === 'function') {
                                                window.startRoseQuoteTypewriter();
                                            }
                                        }, 1000);
                                    }, 1000);
                                }, 1000);
                            }, 2000);
                        }, 1500);
                    } else {
                        statusEl.textContent = 'Rose ' + found + ' of ' + roseCount + '!';
                    }
                } else {
                    cell.classList.add('empty');
                    cell.textContent = '·';
                }
                setTimeout(function () { cell.classList.remove('pop'); }, 450);
            }

            initGame();
        })();
    </script>
    <script>
        // When Rose Day screen opens: tell parent to stop any playing song and play Chot Dil Pe Lagi.
        if (window.parent !== window) {
            window.parent.postMessage('playRoseDaySong', '*');
        }
        // When user leaves Rose Day (e.g. Go back): tell parent to stop Rose song and play default Perfect song.
        window.addEventListener('beforeunload', function () {
            if (window.parent !== window) {
                window.parent.postMessage('restoreDefaultMusic', '*');
            }
        });
    </script>
</body>

</html>
