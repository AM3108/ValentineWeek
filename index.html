<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- The title will be updated dynamically using config.json -->
    <title>Happy Valentine's Day My Love 💗💗💗</title>
    <link rel="stylesheet" href="quotes.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        .music {
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            position: fixed;
            bottom: 3.5vh;
            right: 3.5vh;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 2147483647;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }

        .music > .iconfont,
        .music > .music-close {
            font-size: 26px;
            color: #fff;
            cursor: pointer;
            animation: rotating 1.2s linear infinite;
            animation-play-state: paused;
        }

        .music > .iconfont.rotate,
        .music > .music-close.rotate {
            animation-play-state: running;
        }

        @keyframes rotating {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(1turn);
            }
        }

        @font-face {
            font-family: 'iconfont';
            src: url('//at.alicdn.com/t/font_669713_r7pgq0vmjqc.eot');
            src: url('//at.alicdn.com/t/font_669713_r7pgq0vmjqc.eot?#iefix') format('embedded-opentype'),
                url('//at.alicdn.com/t/font_669713_r7pgq0vmjqc.woff2') format('woff2'),
                url('//at.alicdn.com/t/font_669713_r7pgq0vmjqc.woff') format('woff'),
                url('//at.alicdn.com/t/font_669713_r7pgq0vmjqc.ttf') format('truetype'),
                url('//at.alicdn.com/t/font_669713_r7pgq0vmjqc.svg#iconfont') format('svg');
        }

        .iconfont {
            font-family: "iconfont" !important;
            font-size: 16px;
            font-style: normal;
            -webkit-font-smoothing: antialiased;
            -webkit-text-stroke-width: 0.2px;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>

<body>
    <script>
    (function(){var s=location.search;if(s.indexOf('_=')===-1){location.replace(location.pathname+(s?s+'&':'?')+'_='+Date.now());return;}var c=s.replace(/[?&]_=\d+/g,'').replace(/^&/,'')||'';var u=location.pathname+(c?'?'+c:'');if(u!==location.pathname+s)history.replaceState(null,'',u);})();
    </script>
    <!-- Content iframe where your pages (index.html, rose.html, etc.) will be loaded -->
    <iframe src="main.html" style="width: 100%; height: 100vh; border: none;" id="content-frame"></iframe>

    <!-- Music element positioned based on screen size -->
    <div class="music" title="Toggle music" aria-label="Toggle music">
        <span class="material-symbols-outlined music-close" aria-hidden="true">music_note</span>
        <!-- Audio element without autoplay and muted attributes -->
        <audio class="audio" preload loop>
            <source src="./assets/A_Thousand_Years-528635.mp3" type="audio/mp3" />
            Your browser does not support the audio element.
        </audio>
    </div>
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
    <script>
        var musicDom = document.querySelector('.music');
        var audioDom = document.querySelector('.audio');
        var musicCloseDom = musicDom.querySelector('.music-close');

        // Existing logic for audio on iOS/Android (if needed)
        if (audioDom.readyState == 4) { // Android-specific logic
            console.log('loaded');
        } else { // iOS logic
            audioDom.addEventListener('play', function () {
                try {
                    musicCloseDom.classList.add('rotate');
                } catch (error) {
                    // Handle error if necessary
                }
            }, false);
            audioDom.addEventListener('canplaythrough', function () {
                try {
                    var promise = audioDom.play();
                    if (promise !== undefined) {
                        promise.then(function () {
                            musicCloseDom.classList.add('rotate');
                        }).catch(function () {
                            musicCloseDom.classList.remove('rotate');
                        });
                    }
                } catch (error) {
                    console.log('error', error);
                }
            }, false);
            audioDom.load();
        }

        // On click, toggle play/pause manually.
        musicDom.addEventListener('click', function (event) {
            if (!audioDom.paused) {
                audioDom.pause();
                musicCloseDom.classList.remove('rotate');
            } else {
                audioDom.play();
                musicCloseDom.classList.add('rotate');
            }
            event.preventDefault();
        }, false);

        // Auto-start music when website opens or refreshes (may be blocked by browser until user interaction)
        function tryStartMusic() {
            if (audioDom && audioDom.paused) {
                audioDom.play().then(function () { musicCloseDom.classList.add('rotate'); }).catch(function () { });
            }
        }
        if (audioDom.readyState >= 3) {
            tryStartMusic();
        } else {
            audioDom.addEventListener('canplaythrough', function () { tryStartMusic(); }, { once: true });
        }
        window.addEventListener('load', function () {
            setTimeout(tryStartMusic, 300);
        });
        window.addEventListener('pageshow', function (e) {
            if (audioDom && audioDom.paused) tryStartMusic();
        });
        // If autoplay was blocked, start music on first user click anywhere (e.g. inside iframe)
        window.addEventListener('message', function (e) {
            if (e.data === 'startMusic' && audioDom.paused) {
                tryStartMusic();
            }
        }, false);
        document.documentElement.addEventListener('click', function firstPageClick() {
            document.documentElement.removeEventListener('click', firstPageClick);
            if (audioDom.paused) tryStartMusic();
        }, { once: true });

        // Listen for a message from child pages (e.g. index.html) to start the music.
        window.addEventListener('message', function (e) {
            if (e.data === 'startMusic') {
                if (audioDom.paused) {
                    audioDom.play();
                    musicCloseDom.classList.add('rotate');
                }
            }
        }, false);

        // Fetch configuration and update the document title dynamically.
        fetch('config.json')
            .then(response => response.json())
            .then(config => {
                // Update the title with the names from the configuration file.
                document.title = `Happy Valentine's Day, ${config.fpName} & ${config.spName}`;
            })
            .catch(error => console.error('Error loading config:', error));

            document.addEventListener('DOMContentLoaded', function () {
        const audioDom = document.querySelector('.audio'); // Get the audio element
        const musicCloseDom = document.querySelector('.music-close'); // Get the music icon element

        // Listen for a message to stop the music
        window.addEventListener('message', function (event) {
            if (event.data === 'stopMusic') {
                if (audioDom) {
                    audioDom.pause(); // Pause the audio
                    audioDom.currentTime = 0; // Reset the audio to the beginning
                    console.log("Music stopped via message.");
                }

                // Remove the rotate class from the music icon
                if (musicCloseDom) {
                    musicCloseDom.classList.remove('rotate');
                }
            }
            if (event.data === 'playRoseDaySong') {
                if (audioDom) {
                    audioDom.pause();
                    audioDom.currentTime = 0;
                    var roseDaySong = encodeURI('./assets/Chot Dil Pe Lagi  Lyrical _ Ishq Vishk Rebound _Rohit_ Pashmina_ Jibraan_ Naila _ Asees_Varun_Rochak(MP3_160K).mp3');
                    audioDom.src = roseDaySong;
                    audioDom.load();
                    audioDom.play().catch(function () { });
                }
                if (musicCloseDom) {
                    musicCloseDom.classList.add('rotate');
                }
            }
            // When any day page opens: stop current song and play that day's song (object: { type: 'playDaySong', src: 'path' }).
            if (event.data && event.data.type === 'playDaySong' && event.data.src) {
                if (audioDom) {
                    audioDom.pause();
                    audioDom.currentTime = 0;
                    audioDom.src = encodeURI(event.data.src);
                    audioDom.load();
                    function playWhenReady() {
                        audioDom.removeEventListener('canplaythrough', playWhenReady);
                        audioDom.removeEventListener('canplay', playWhenReady);
                        audioDom.play().then(function () {
                            if (musicCloseDom) musicCloseDom.classList.add('rotate');
                        }).catch(function () { });
                    }
                    audioDom.addEventListener('canplaythrough', playWhenReady, { once: true });
                    audioDom.addEventListener('canplay', playWhenReady, { once: true });
                    if (audioDom.readyState >= 3) playWhenReady();
                }
            }
            // When user leaves any day: stop day song and restore default song.
            if (event.data === 'restoreDefaultMusic') {
                if (audioDom) {
                    audioDom.pause();
                    audioDom.currentTime = 0;
                    audioDom.src = encodeURI('./assets/A_Thousand_Years-528635.mp3');
                    audioDom.load();
                    audioDom.play().catch(function () { });
                }
                if (musicCloseDom) {
                    musicCloseDom.classList.add('rotate');
                }
            }
        }, false);
    });
    </script>
</body>

</html>
